<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA ANIME - غموض</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#060606;color:#fff}
header{background:#000;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #fff;position:sticky;top:0;z-index:999}
.logo{font-size:30px;font-weight:900}.logo span{background:#fff;color:#000;padding:2px 12px;border-radius:8px}
.cats{display:flex;gap:8px;padding:12px 5%;overflow-x:auto;background:#0f0f0f;position:sticky;top:66px;z-index:998}
.cats button{border:1px solid #333;background:#1a1a1a;color:#fff;padding:8px 18px;border-radius:30px;font-weight:700;cursor:pointer;white-space:nowrap}
.cats button.active{background:#fff;color:#000;border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;padding:20px 5% 80px}
.card{position:relative;background:#111;border-radius:16px;overflow:hidden;cursor:pointer;border:1px solid #222}
.card:hover{transform:scale(1.05);border-color:#fff;z-index:2}
.card img{width:100%;height:270px;object-fit:cover;display:block;background:#1a1a1a}
.card .num{position:absolute;top:8px;left:8px;background:#fff;color:#000;font-weight:900;padding:2px 10px;border-radius:20px;font-size:12px}
.card .info{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.95));padding:40px 10px 10px}
.card h3{font-size:14px;font-weight:900}
.meta{display:flex;justify-content:space-between;margin-top:4px}
.meta .cat{font-size:10px;background:#fff;color:#000;padding:2px 8px;border-radius:10px;font-weight:700}
.search{padding:14px 5%}.search input{width:100%;padding:14px 20px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;outline:none}
</style>
</head>
<body>
<header><div class="logo">NOVA<span>ANIME</span></div><div style="opacity:.6;font-size:12px">غموض • 50 ANIME</div></header>
<div class="cats" id="cats"></div>
<div class="search"><input id="s" placeholder="قلب فالغموض..." oninput="filt()"></div>
<div class="grid" id="grid"></div>

<script>
const p = u => `https://wsrv.nl/?url=${encodeURIComponent(u)}&w=400&h=600&fit=cover&output=webp`;

const animes=[
// Top غموض
{name:"Monster",cat:"غموض",img:p("https://cdn.myanimelist.net/images/anime/3/73227.jpg")},
{name:"Death Note",cat:"غموض",img:p("https://cdn.myanimelist.net/images/anime/9/9453.jpg")},
{name:"Steins;Gate",cat:"غموض",img:p("https://cdn.myanimelist.net/images/anime/5/73199.jpg")},
{name:"Erased",cat:"غموض",img:p("https://cdn.myanimelist.net/images/anime/10/78745.jpg")},
{name:"The Promised Neverland",cat:"غموض",img:p("https://cdn.myanimelist.net/images/anime/5/97746.jpg")},
{name:"Another",cat:"غموض",img:p("https://cdn.myanimelist.net/images/anime/3/75509.jpg")},
{name:"Paranoia Agent",cat:"غموض",img:p("https://cdn.myanimelist.net/images/anime/3/79191.jpg")},
{name:"Higurashi",cat:"غموض",img:p("https://cdn.myanimelist.net/images/anime/6/78100.jpg")},
{name:"Shinsekai Yori",cat:"غموض",img:p("https://cdn.myanimelist.net/images/anime/1077/100815.jpg")},
{name:"ID:Invaded",cat:"غموض",img:p("https://cdn.myanimelist.net/images/anime/1862/109200.jpg")},
{name:"Terror in Resonance",cat:"غموض",img:p("https://cdn.myanimelist.net/images/anime/4/76015.jpg")},
{name:"Case Closed",cat:"غموض",img:p("https://cdn.myanimelist.net/images/anime/7/75199.jpg")},
{name:"Ghost Hunt",cat:"غموض",img:p("https://cdn.myanimelist.net/images/anime/4/74204.jpg")},
{name:"Baccano!",cat:"غموض",img:p("https://cdn.myanimelist.net/images/anime/4/87639.jpg")},
{name:"Durarara!!",cat:"غموض",img:p("https://cdn.myanimelist.net/images/anime/12/81194.jpg")},
{name:"Boogiepop",cat:"غموض",img:p("https://cdn.myanimelist.net/images/anime/1137/123512.jpg")},
{name:"Moriarty the Patriot",cat:"غموض",img:p("https://cdn.myanimelist.net/images/anime/1589/119128.jpg")},
{name:"UN-GO",cat:"غموض",img:p("https://cdn.myanimelist.net/images/anime/2/31845.jpg")},
{name:"Hyoka",cat:"غموض",img:p("https://cdn.myanimelist.net/images/anime/13/50521.jpg")},
{name:"The Perfect Insider",cat:"غموض",img:p("https://cdn.myanimelist.net/images/anime/4/75641.jpg")},
];

const cats=["الكل","غموض","نفسي","تحقيق","رعب غموض"];
let cur="الكل";
function initCats(){document.getElementById('cats').innerHTML=cats.map(c=>`<button class="${c===cur?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('');}
function setCat(c){cur=c;initCats();filt();}
function filt(){
let q=document.getElementById('s').value.toLowerCase();
let list=animes.filter(a=>(cur==="الكل"||a.cat===cur||cur==="غموض")&&a.name.toLowerCase().includes(q));
document.getElementById('grid').innerHTML=list.map((a,i)=>`
<div class="card">
<div class="num">#${String(i+1).padStart(2,'0')}</div>
<img src="${a.img}" alt="${a.name}" loading="lazy">
<div class="info"><h3>${a.name}</h3><div class="meta"><span class="cat">${a.cat}</span></div></div>
</div>`).join('');
}
initCats();filt();
</script>
</body>
</html>
