<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Anime - غموض</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
body { background:#0a0a12; color:#fff; }
header { padding:20px; text-align:center; background:#151528; border-bottom:2px solid #7c3aed; }
header h1 { color:#a78bfa; }
header h1 span { color:#fff; }
.categories { display:flex; gap:10px; justify-content:center; padding:15px; background:#111; position:sticky; top:0; z-index:10; }
.categories button { background:#222; color:#fff; border:1px solid #7c3aed; padding:8px 18px; border-radius:20px; cursor:pointer; }
.categories button.active { background:#7c3aed; }
#anime-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap:15px; padding:20px; }
.card { background:#151528; border-radius:12px; overflow:hidden; transition:.3s; cursor:pointer; }
.card:hover { transform:scale(1.05); }
.card img { width:100%; height:260px; object-fit:cover; }
.card .info { padding:10px; }
.card .info h3 { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card .info p { font-size:12px; color:#a78bfa; margin-top:5px; }
.loading { text-align:center; padding:50px; font-size:20px; }
</style>
</head>
<body>

<header>
<h1><span>NOVA</span> ANIME - غموض</h1>
<p>أفضل أنميات الغموض والرعب النفسي</p>
</header>

<div class="categories">
<button class="active" data-filter="all">الكل</button>
<button data-filter="top">الأكثر شهرة</button>
<button data-filter="new">جديد</button>
</div>

<div id="anime-grid"><div class="loading">⏳ كنجيب أنميات الغموض...</div></div>

<script>
const grid = document.getElementById('anime-grid');
let allData = [];

// 7 = Mystery ID فـ Jikan
async function loadMystery() {
  try {
    const res = await fetch('https://api.jikan.moe/v4/anime?genres=7&order_by=score&sort=desc&limit=24&sfw=true');
    const data = await res.json();
    allData = data.data;
    display(allData);
  } catch(e) {
    grid.innerHTML = '<p class="loading">❌ خطأ فالتحميل، عاود حاول</p>';
  }
}

function display(animes) {
  grid.innerHTML = '';
  animes.forEach(anime => {
    grid.innerHTML += `
      <div class="card" onclick="window.open('${anime.url}','_blank')">
        <img src="${anime.images.jpg.large_image_url}" loading="lazy">
        <div class="info">
          <h3>${anime.title}</h3>
          <p>⭐ ${anime.score || 'N/A'} | ${anime.year || ''}</p>
        </div>
      </div>
    `;
  });
}

// فلتر بسيط
document.querySelectorAll('.categories button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.categories button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    if(btn.dataset.filter === 'all') display(allData);
    if(btn.dataset.filter === 'top') display([...allData].sort((a,b)=>b.score-a.score));
    if(btn.dataset.filter === 'new') display([...allData].sort((a,b)=> (b.year||0)-(a.year||0)));
  });
});

loadMystery();
</script>

</body>
</html>
