<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA ANIME - 50 انمي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#070710;color:#fff}
header{padding:14px 4%;display:flex;justify-content:space-between;background:#10101a;border-bottom:1px solid #222;position:sticky;top:0;z-index:10}
.logo{font-size:24px;font-weight:900}.logo b{color:#a78bfa}
.search{width:92%;margin:18px auto;display:flex;background:#15151f;border:1px solid #2a2a3a;border-radius:30px;padding:12px 20px}
.search input{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:15px}
.grid{width:92%;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding-bottom:50px}
.card{background:#12121e;border-radius:16px;overflow:hidden;border:1px solid #1f1f33;cursor:pointer;transition:.3s}
.card:hover{transform:translateY(-5px);border-color:#a78bfa}
.card img{width:100%;height:230px;object-fit:cover}
.info{padding:10px}.info h4{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info p{font-size:11px;opacity:.6;margin-top:4px;height:34px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tag{background:#a78bfa;color:#000;font-size:10px;padding:2px 8px;border-radius:20px;display:inline-block;margin-top:6px;font-weight:700}
#player{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:999;padding:15px}
#player.active{display:flex}
.box{width:100%;max-width:800px;background:#151525;border-radius:16px;overflow:hidden}
.box iframe{width:100%;height:420px;border:none}
</style>
</head>
<body>
<header><div class="logo">NOVA<b>.ANIME</b></div><div>🔥 50 انمي</div></header>
<div class="search"><input id="s" placeholder="قلب على انمي..." oninput="filterA()"><span>🔍</span></div>
<div class="grid" id="grid"></div>
<div id="player" onclick="closeP()"><div class="box" onclick="event.stopPropagation()"><iframe id="vid" src="" allowfullscreen></iframe><div style="padding:14px;display:flex;justify-content:space-between;align-items:center"><h3 id="t"></h3><button onclick="closeP()" style="background:#a78bfa;border:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:700">اغلاق</button></div></div></div>

{name:"Dragon Ball Super",img:"https://cdn.myanimelist.net/images/anime/18/51557.jpg",desc:"مستويات قوة جديدة."},
{name:"Bleach TYBW",img:"https://cdn.myanimelist.net/images/anime/1908/135431.jpg",desc:"حرب الألف سنة الدموية."}

function render(list){
const g=document.getElementById('grid');
g.innerHTML='';
list.forEach(a=>{
g.innerHTML+=`<div class="card" onclick="play('${a.name}')"><img src="${a.img}" loading="lazy"><div class="info"><h4>${a.name}</h4><p>${a.desc}</p><span class="tag">HD</span></div></div>`
});
}
function filterA(){const q=document.getElementById('s').value.toLowerCase();render(animes.filter(a=>a.name.toLowerCase().includes(q)))}
function play(t){document.getElementById('player').classList.add('active');document.getElementById('t').innerText=t;document.getElementById('vid').src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1"}
function closeP(){document.getElementById('player').classList.remove('active');document.getElementById('vid').src=""}
render(animes);
</script>
</body>
</html>
