<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA ANIME</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#050505;color:#fff}
header{background:#fff;color:#000;padding:18px 5%;display:flex;justify-content:space-between;position:sticky;top:0;z-index:999}
.logo{font-size:28px;font-weight:900} .logo b{background:#000;color:#fff;padding:0 8px;border-radius:6px}
.cats{display:flex;gap:8px;padding:14px 5%;overflow-x:auto;background:#0a0a0a;border-bottom:1px solid #222;position:sticky;top:66px;z-index:998}
.cats button{border:1.5px solid #fff;background:transparent;color:#fff;padding:8px 18px;border-radius:30px;font-weight:700;cursor:pointer;white-space:nowrap}
.cats button.active,.cats button:hover{background:#fff;color:#000}
.search{padding:16px 5%} .search input{width:100%;padding:14px 20px;border-radius:12px;border:1.5px solid #333;background:#111;color:#fff;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;padding:10px 5% 60px}
.card{background:#111;border:1px solid #222;border-radius:14px;overflow:hidden}
.card img{width:100%;height:240px;object-fit:cover;background:#1a1a1a;display:block}
.info{padding:10px} .info h3{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;justify-content:space-between;margin-top:6px} .cat{font-size:11px;opacity:.5} .tag{font-size:10px;background:#fff;color:#000;padding:2px 8px;border-radius:20px;font-weight:900}
</style>
</head>
<body>
<header><div class="logo">NOVA<b>ANIME</b></div><div>50 انمي</div></header>
<div class="cats" id="cats">
<button class="active" onclick="filterCat('الكل')">الكل (50)</button>
<button onclick="filterCat('اكشن')">اكشن</button>
<button onclick="filterCat('ايسيكاي')">ايسيكاي</button>
<button onclick="filterCat('مغامرات')">مغامرات</button>
<button onclick="filterCat('شونين')">شونين</button>
<button onclick="filterCat('رعب')">رعب</button>
<button onclick="filterCat('كوميديا')">كوميديا</button>
</div>
<div class="search"><input id="s" placeholder="قلب على انمي..." oninput="doFilter()"></div>
<div class="grid" id="grid"></div>
<script>
const animes=[
{name:"One Piece",cat:"مغامرات",img:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/6/73245.jpg&w=300&h=400&fit=cover"},
{name:"Attack on Titan",cat:"اكشن",img:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/10/47347.jpg&w=300&h=400&fit=cover"},
{name:"Demon Slayer",cat:"اكشن",img:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/1286/99889.jpg&w=300&h=400&fit=cover"},
{name:"Jujutsu Kaisen",cat:"اكشن",img:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/15/92034.jpg&w=300&h=400&fit=cover"},
{name:"Solo Leveling",cat:"اكشن",img:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/1925/148921.jpg&w=300&h=400&fit=cover"},
{name:"Bleach",cat:"شونين",img:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/3/40451.jpg&w=300&h=400&fit=cover"},
{name:"Hunter x Hunter",cat:"مغامرات",img:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/11/33657.jpg&w=300&h=400&fit=cover"},
{name:"Re:Zero",cat:"ايسيكاي",img:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/1522/128039.jpg&w=300&h=400&fit=cover"},
{name:"Death Note",cat:"رعب",img:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/9/9453.jpg&w=300&h=400&fit=cover"},
{name:"Tokyo Ghoul",cat:"رعب",img:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/5/64449.jpg&w=300&h=400&fit=cover"},
{name:"Chainsaw Man",cat:"اكشن",img:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/1365/135695.jpg&w=300&h=400&fit=cover"},
{name:"Fullmetal Alchemist",cat:"اكشن",img:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/1223/96541.jpg&w=300&h=400&fit=cover"},
{name:"My Hero Academia",cat:"شونين",img:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/17/92357.jpg&w=300&h=400&fit=cover"},
{name:"One Punch Man",cat:"كوميديا",img:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/12/76049.jpg&w=300&h=400&fit=cover"},
{name:"Frieren",cat:"مغامرات",img:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/16/141217.jpg&w=300&h=400&fit=cover"},
{name:"Boruto",cat:"شونين",img:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/1096/136029.jpg&w=300&h=400&fit=cover"},
{name:"Gintama",cat:"كوميديا",img:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/4/10508.jpg&w=300&h=400&fit=cover"},
{name:"KonoSuba",cat:"ايسيكاي",img:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/2/112300.jpg&w=300&h=400&fit=cover"},
{name:"Overlord",cat:"ايسيكاي",img:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/79/104892.jpg&w=300&h=400&fit=cover"},
{name:"Sword Art Online",cat:"ايسيكاي",img:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/11/39717.jpg&w=300&h=400&fit=cover"}
];
let cur='الكل';
function render(list){
let g=document.getElementById('grid');g.innerHTML='';
list.forEach(a=>{
g.innerHTML+=`<div class="card"><img src="${a.img}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x400/111/fff?text='+encodeURIComponent(a.name)"><div class="info"><h3>${a.name}</h3><div class="meta"><span class="cat">${a.cat}</span><span class="tag">HD</span></div></div></div>`;
});
}
function filterCat(c){cur=c;document.querySelectorAll('.cats button').forEach(b=>b.classList.toggle('active',b.textContent.includes(c)));doFilter();}
function doFilter(){let q=document.getElementById('s').value.toLowerCase();let f=animes.filter(a=>{return (cur==='الكل'||a.cat===cur)&&(a.name.toLowerCase().includes(q)||a.cat.includes(q));});render(f);}
render(animes);
</script>
</body>
</html>
