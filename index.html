*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#060606;color:#fff}
header{background:#000;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #fff;position:sticky;top:0;z-index:999}
.logo{font-size:30px;font-weight:900}.logo span{background:#fff;color:#000;padding:2px 12px;border-radius:8px}
.cats{display:flex;gap:8px;padding:12px 5%;overflow-x:auto;background:#0f0f0f;position:sticky;top:66px;z-index:998;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{border:1px solid #333;background:#1a1a1a;color:#fff;padding:8px 18px;border-radius:30px;font-weight:700;cursor:pointer;white-space:nowrap}
.cats button.active{background:#fff;color:#000;border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:16px;padding:20px 5% 80px}
.card{position:relative;background:#111;border-radius:16px;overflow:hidden;cursor:pointer;border:1px solid #222;transition:.2s}
.card:hover{transform:scale(1.05);border-color:#fff;z-index:2}
.card img{width:100%;height:270px;object-fit:cover;display:block;background:#1a1a1a}
.card .num{position:absolute;top:8px;left:8px;background:#fff;color:#000;font-weight:900;padding:2px 10px;border-radius:20px;font-size:12px}
.card .info{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.95));padding:40px 10px 10px}
.card h3{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;justify-content:space-between;margin-top:4px}
.meta .cat{font-size:10px;background:#fff;color:#000;padding:2px 8px;border-radius:10px;font-weight:700}
.search{padding:14px 5%}.search input{width:100%;padding:14px 20px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;outline:none}
</style>
