<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIMORA - انمي عرب</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0d0d14;color:#fff}
header{display:flex;justify-content:space-between;padding:15px 4%;align-items:center}
.logo{font-size:26px;font-weight:900}.logo span{color:#8b5cf6}
.search-box{width:90%;margin:15px auto;display:flex;background:#1a1a28;border:1px solid #8b5cf6;border-radius:30px;padding:12px 20px}
.search-box input{flex:1;background:transparent;border:none;color:#fff;outline:none}
.hero{width:92%;margin:15px auto;background:#1e1e32;border-radius:16px;padding:30px;min-height:280px}
.hero h1{font-size:42px;color:#fff}.btn{padding:10px 18px;border-radius:10px;border:none;margin:5px;cursor:pointer}
.btn-p{background:#8b5cf6;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#15151f;border-radius:12px;overflow:hidden}.card img{width:100%;height:150px;object-fit:cover}
.card-info{padding:8px;text-align:center;font-size:13px}
.cat{padding:8px 16px;border-radius:20px;background:#1f1f2e;border:1px solid #333;display:inline-block;margin:5px}
</style>
</head>
<body>
<header><div class="logo">◤ ANIMORA</div><div>الرئيسية • تصفح • المفضلة</div></header>
<div class="search-box"><input placeholder="ابحث عن انمي..."><span>🔍</span></div>
<div class="hero"><h1>SPY ECHO</h1><p>الموسم 2 - يعرض الآن</p><p>عميل سري يكتشف مؤامرة في نيو-طوكيو</p><button class="btn btn-p">▶ شاهد الآن</button><button class="btn">ⓘ التفاصيل</button></div>
<div style="width:92%;margin:auto"><span class="cat">أكشن</span><span class="cat">رومانسي</span><span class="cat">فانتازيا</span><span class="cat">خيال علمي</span><div class="grid" style="margin-top:15px">
<div class="card"><img src="https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=300"><div class="card-info">CRIMSON BLADE</div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=300"><div class="card-info">LOVE IN SAKURA HILL</div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=300"><div class="card-info">NEON DRIFT</div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1473186505569-9c61870c11f9?w=300"><div class="card-info">QUIET HARBOR</div></div>
</div></div>
</body>
</html>
