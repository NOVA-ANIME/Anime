<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA ANIME</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}body{background:#08080f;color:#fff}header{padding:14px 4%;display:flex;justify-content:space-between;align-items:center;background:#0f0f17;border-bottom:1px solid #222;position:sticky;top:0;z-index:10}.logo{font-size:24px;font-weight:900}.logo b{color:#a78bfa}.search{width:92%;margin:18px auto;display:flex;gap:10px;background:#15151f;border:1px solid #333;border-radius:30px;padding:12px 20px}.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}.grid{width:92%;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;padding-bottom:40px}.card{background:#12121a;border-radius:16px;overflow:hidden;border:1px solid #1e1e2e;cursor:pointer;transition:.3s}.card:hover{transform:translateY(-6px);border-color:#a78bfa;box-shadow:0 10px 30px rgba(167,139,250,.3)}.card img{width:100%;height:240px;object-fit:cover}.info{padding:10px}.info h4{font-size:13px;height:18px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.info p{font-size:11px;opacity:.6;margin-top:4px;height:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:16px}.tag{display:inline-block;background:#a78bfa;color:#000;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:6px}#modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:999;padding:15px}#modal.active{display:flex}.box{width:100%;max-width:850px;background:#11131f;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;max-height:90vh}.box iframe{width:100%;height:400px;border:none}.box-content{padding:18px;overflow:auto}</style></head><body><header><div class="logo">NOVA<b>.ANIME</b></div><div>50 انمي + وصف</div></header><div class="search"><input id="s" placeholder="ابحث..." oninput="filterA()"><span>🔍</span></div><div class="grid" id="grid"></div><div id="modal" onclick="closeM()"><div class="box" onclick="event.stopPropagation()"><iframe id="vid" src="" allowfullscreen></iframe><div class="box-content"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="mtitle"></h2><button onclick="closeM()" style="background:#a78bfa;border:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:700">اغلاق ✕</button></div><p id="mdesc" style="margin-top:10px;opacity:.8;line-height:1.7"></p><div style="margin-top:12px"><span id="mrate" class="tag"></span></div></div></div></div><script>
const animes=[
{name:"One Piece",img:"https://cdn.myanimelist.net/images/anime/6/73245.jpg",desc:"لوفي وطاقمه يبحثون عن الون بيس ليصبح ملك القراصنة.",rate:"⭐ 9.2"},
{name:"Attack on Titan",img:"https://cdn.myanimelist.net/images/anime/10/47347.jpg",desc:"البشرية تقاتل العمالقة للبقاء على قيد الحياة.",rate:"⭐ 9.1"},
{name:"Naruto",img:"https://cdn.myanimelist.net/images/anime/5/17407.jpg",desc:"ناروتو يحلم بأن يصبح الهوكاجي رغم كونه منبوذا.",rate:"⭐ 8.8"},
{name:"Demon Slayer",img:"https://cdn.myanimelist.net/images/anime/1286/99889.jpg",desc:"تانجيرو يقاتل الشياطين لانقاذ اخته نيزوكو.",rate:"⭐ 8.9"},
{name:"Jujutsu Kaisen",img:"https://cdn.myanimelist.net/images/anime/1792/138022.jpg",desc:"يوجي يبتلع اصبع سوكونا ويدخل عالم الجوجوتسو.",rate:"⭐ 8.8"},
{name:"Solo Leveling",img:"https://cdn.myanimelist.net/images/anime/1925/140553.jpg",desc:"أضعف صياد يصبح الأقوى عبر نظام غامض.",rate:"⭐ 8.7"},
{name:"Frieren",img:"https://cdn.myanimelist.net/images/anime/1015/138006.jpg",desc:"الساحرة فرييرن تتعلم معنى الوقت بعد موت البطل.",rate:"⭐ 9.3"},
{name:"Death Note",img:"https://cdn.myanimelist.net/images/anime/9/9453.jpg",desc:"لايت يجد مذكرة تقتل أي شخص يكتب اسمه فيها.",rate:"⭐ 9.0"},
{name:"Kaiju No.8",img:"https://cdn.myanimelist.net/images/anime/1976/143678.jpg",desc:"كافكا يتحول الى كايجو ويحارب الوحوش.",rate:"⭐ 8.3"},
{name:"Dandadan",img:"https://cdn.myanimelist.net/images/anime/1406/150491.jpg",desc:"قتال أشباح وكائنات فضائية بطريقة مجنونة.",rate:"⭐ 8.5"},
{name:"Mashle",img:"https://cdn.myanimelist.net/images/anime/1584/143719.jpg",desc:"فتى بلا سحر يعتمد على عضلاته في عالم السحرة.",rate:"⭐ 7.9"},
{name:"Dr Stone",img:"https://cdn.myanimelist.net/images/anime/1663/102030.jpg",desc:"سينكو يعيد بناء الحضارة بالعلم بعد تحجر البشر.",rate:"⭐ 8.2"},
{name:"Fire Force",img:"https://cdn.myanimelist.net/images/anime/1670/103519.jpg",desc:"فرقة اطفاء تحارب احتراق البشر التلقائي.",rate:"⭐ 7.8"},
{name:"Mob Psycho 100",img:"https://cdn.myanimelist.net/images/anime/8/80356.jpg",desc:"موب يملك قوى نفسية هائلة يحاول كبتها.",rate:"⭐ 8.5"},
{name:"Overlord",img:"https://cdn.myanimelist.net/images/anime/7/88019.jpg",desc:"لاعب يعلق داخل لعبة ويصبح سيد الظلام.",rate:"⭐ 8.0"},
{name:"Slime Tensei",img:"https://cdn.myanimelist.net/images/anime/1694/93337.jpg",desc:"رجل يموت ويولد من جديد كسلايم بقوى خارقة.",rate:"⭐ 8.1"},
{name:"Oshi No Ko",img:"https://cdn.myanimelist.net/images/anime/1812/134736.jpg",desc:"طبيب يولد من جديد كابن لآيدول مشهورة.",rate:"⭐ 8.3"},
{name:"Wind Breaker",img:"https://cdn.myanimelist.net/images/anime/1022/141411.jpg",desc:"مدرسة جانحين تحمي مدينتها بقبضاتها.",rate:"⭐ 7.7"},
{name:"Fairy Tail",img:"https://cdn.myanimelist.net/images/anime/5/18179.jpg",desc:"نقابة سحرة يخوضون مغامرات مجنونة.",rate:"⭐ 7.9"},
{name:"Boruto",img:"https://cdn.myanimelist.net/images/anime/6/82899.jpg",desc:"ابن ناروتو يحاول اثبات نفسه.",rate:"⭐ 6.9"}
];
function render(list){const g=document.getElementById('grid');g.innerHTML='';list.forEach((a,i)=>{g.innerHTML+=`<div class="card" onclick="openM(${i})"><img src="${a.img}"><div class="info"><h4>${a.name}</h4><p>${a.desc}</p><span class="tag">${a.rate}</span></div></div>`})}
let currentList=animes;
function filterA(){const q=document.getElementById('s').value.toLowerCase();currentList=animes.filter(a=>a.name.toLowerCase().includes(q));render(currentList)}
function openM(i){const a=currentList[i];document.getElementById('modal').classList.add('active');document.getElementById('mtitle').innerText=a.name;document.getElementById('mdesc').innerText=a.desc;document.getElementById('mrate').innerText=a.rate;document.getElementById('vid').src="https://www.youtube.com/embed/5i8T8JgK9wQ?autoplay=1"}
function closeM(){document.getElementById('modal').classList.remove('active');document.getElementById('vid').src=""}
render(animes);
</script></body></html>
