<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="NOVA ANIME - شاهد 50 انمي مشهور بجودة عالية">
<meta name="robots" content="index, follow"><meta name="keywords" content="انمي, anime, berserk, boruto, one piece, naruto">
<meta property="og:title" content="NOVA ANIME">
<meta property="og:description" content="شاهد افضل 50 انمي">
<title>NOVA ANIME - 50 انمي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}body{background:#070710;color:#fff}header{padding:14px 4%;display:flex;justify-content:space-between;background:#10101a;border-bottom:1px solid #222;position:sticky;top:0;z-index:10}.logo{font-size:24px;font-weight:900}.logo b{color:#a78bfa}.search{width:92%;margin:18px auto;display:flex;background:#15151f;border:1px solid #2a2a3a;border-radius:30px;padding:12px 20px}.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}.grid{width:92%;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding-bottom:50px}.card{background:#12121e;border-radius:16px;overflow:hidden;border:1px solid #1f1f33;cursor:pointer}.card img{width:100%;height:230px;object-fit:cover}.info{padding:10px}.info h4{font-size:13px}.info p{font-size:11px;opacity:.6}.tag{background:#a78bfa;color:#000;font-size:10px;padding:2px 8px;border-radius:20px}</style>
</head>
<body>
<header><div class="logo">NOVA<b>.ANIME</b></div></header>
<div class="search"><input id="s" placeholder="قلب على انمي..." oninput="filterA()"></div>
<div class="grid" id="grid"></div>
<script>
const animes=[{name:"One Piece",img:"https://cdn.myanimelist.net/images/anime/6/73245.jpg",desc:"لوفي والون بيس"},{name:"Berserk",img:"https://cdn.myanimelist.net/images/anime/1384/121669.jpg",desc:"غاتس والانتقام"},{name:"Boruto",img:"https://cdn.myanimelist.net/images/anime/1096/136029.jpg",desc:"ابن ناروتو"},{name:"Naruto",img:"https://cdn.myanimelist.net/images/anime/13/17405.jpg",desc:"ناروتو"},{name:"Attack on Titan",img:"https://cdn.myanimelist.net/images/anime/10/47347.jpg",desc:"العمالقة"}];
function render(l){let g=document.getElementById('grid');g.innerHTML='';l.forEach(a=>{g.innerHTML+=`<div class=card><img src=${a.img}><div class=info><h4>${a.name}</h4><p>${a.desc}</p><span class=tag>HD</span></div></div>`})}render(animes);function filterA(){let q=document.getElementById('s').value.toLowerCase();render(animes.filter(a=>a.name.toLowerCase().includes(q)))}
</script>
</body>
</html>
