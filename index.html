<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="NOVA ANIME - 50 انمي مشهور - اكشن ايسيكاي مغامرات رعب">
<title>NOVA ANIME - 50 انمي مشهور</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#050505;color:#fff}
header{background:#fff;color:#000;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:999;border-bottom:4px solid #000}
.logo{font-size:30px;font-weight:900} .logo b{background:#000;color:#fff;padding:0 10px;border-radius:8px}
.hero{background:#fff;color:#000;padding:40px 5%;text-align:center}
.hero h1{font-size:36px;font-weight:900}
.cats{display:flex;gap:8px;padding:14px 5%;overflow-x:auto;background:#0a0a0a;border-bottom:1px solid #222;position:sticky;top:68px;z-index:998}
.cats button{border:1.5px solid #fff;background:transparent;color:#fff;padding:8px 18px;border-radius:30px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.2s}
.cats button.active,.cats button:hover{background:#fff;color:#000}
.search{padding:16px 5%} .search input{width:100%;padding:14px 20px;border-radius:12px;border:1.5px solid #333;background:#111;color:#fff;outline:none;font-size:14px}
.search input:focus{border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:16px;padding:10px 5% 60px}
.card{background:#111;border:1px solid #222;border-radius:14px;overflow:hidden;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:#fff}
.card img{width:100%;height:235px;object-fit:cover;background:#1a1a1a;display:block}
.info{padding:10px} .info h3{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;justify-content:space-between;margin-top:6px;align-items:center}
.cat{font-size:11px;opacity:.5} .tag{font-size:10px;background:#fff;color:#000;padding:2px 8px;border-radius:20px;font-weight:900}
footer{background:#fff;color:#000;text-align:center;padding:18px;font-weight:700;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<header><div class="logo">NOVA<b>ANIME</b></div><div style="font-weight:700">50 انمي</div></header>
<div class="hero"><h1>أفضل 50 انمي مشهور - ابيض و اسود</h1><p>اكشن • ايسيكاي • مغامرات • شونين • رعب • كوميديا</p></div>
<div class="cats" id="cats">
<button class="active" onclick="filterCat('الكل')">الكل (50)</button>
<button onclick="filterCat('اكشن')">اكشن</button>
<button onclick="filterCat('ايسيكاي')">ايسيكاي</button>
<button onclick="filterCat('مغامرات')">مغامرات</button>
<button onclick="filterCat('شونين')">شونين</button>
<button onclick="filterCat('رعب')">رعب</button>
<button onclick="filterCat('كوميديا')">كوميديا</button>
</div>
<div class="search"><input id="s" placeholder="قلب: One Piece, Berserk, Boruto..." oninput="doFilter()"></div>
<div class="grid" id="grid"></div>
<footer>NOVA ANIME © 2026 - ابيض و اسود</footer>

let cur='الكل';
function render(list){
let g=document.getElementById('grid');g.innerHTML='';
list.forEach(a=>{
g.innerHTML+=`<div class="card"><img src="${a.img}" loading="lazy" onerror="this.onerror=null;this.src='https://via.placeholder.com/300x400/111/ffffff?text='+encodeURIComponent(a.name)"><div class="info"><h3>${a.name}</h3><div class="meta"><span class="cat">${a.cat}</span><span class="tag">HD</span></div></div></div>`;
});
}
function filterCat(c){cur=c;document.querySelectorAll('.cats button').forEach(b=>{b.classList.toggle('active',b.textContent.includes(c))});doFilter();}
function doFilter(){let q=document.getElementById('s').value.toLowerCase();let f=animes.filter(a=>{return (cur==='الكل'||a.cat===cur)&&(a.name.toLowerCase().includes(q)||a.cat.toLowerCase().includes(q));});render(f);}
render(animes);
</script>
</body>
</html>
