<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA ANIME</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#0a0a0a;color:#fff}
header{background:#fff;color:#000;padding:16px 5%;display:flex;justify-content:space-between;position:sticky;top:0;z-index:999}
.logo{font-weight:900;font-size:26px}.logo b{background:#000;color:#fff;padding:2px 10px;border-radius:8px}
.cats{display:flex;gap:8px;padding:12px 5%;overflow-x:auto;background:#111;position:sticky;top:62px;z-index:998}
.cats button{border:1.5px solid #fff;background:transparent;color:#fff;padding:7px 16px;border-radius:30px;font-weight:700;cursor:pointer}
.cats button.active{background:#fff;color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:20px 5%}
.card{background:#1a1a1a;border:1px solid #333;border-radius:14px;overflow:hidden}
.card img{width:100%;height:230px;object-fit:cover;display:block}
.card .t{padding:10px}.card h3{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;justify-content:space-between;margin-top:6px}
.meta span{font-size:10px}.meta .c{background:#fff;color:#000;padding:2px 8px;border-radius:20px;font-weight:700}
</style>
</head>
<body>
<header><div class="logo">NOVA<b>ANIME</b></div><div>50 انمي</div></header>
<div class="cats" id="cats"></div>
<div style="padding:14px 5%"><input id="s" placeholder="قلب: One Piece, Berserk..." style="width:100%;padding:12px 18px;border-radius:10px;border:1px solid #333;background:#111;color:#fff" oninput="filt()"></div>
<div class="grid" id="grid"></div>
<script>
const animes=[
{name:"One Piece",cat:"مغامرات",img:"https://cdn.myanimelist.net/images/anime/1244/138851.jpg"},
{name:"Berserk",cat:"اكشن",img:"https://cdn.myanimelist.net/images/anime/10/79352.jpg"},
{name:"Attack on Titan",cat:"اكشن",img:"https://cdn.myanimelist.net/images/anime/10/47347.jpg"},
{name:"Naruto",cat:"شونين",img:"https://cdn.myanimelist.net/images/anime/13/17405.jpg"},
{name:"Demon Slayer",cat:"اكشن",img:"https://cdn.myanimelist.net/images/anime/1286/99889.jpg"},
{name:"Jujutsu Kaisen",cat:"اكشن",img:"https://cdn.myanimelist.net/images/anime/1171/109222.jpg"},
{name:"Solo Leveling",cat:"اكشن",img:"https://cdn.myanimelist.net/images/anime/1929/144919.jpg"},
{name:"Bleach",cat:"شونين",img:"https://cdn.myanimelist.net/images/anime/3/40451.jpg"},
{name:"Dragon Ball Z",cat:"شونين",img:"https://cdn.myanimelist.net/images/anime/7/20310.jpg"},
{name:"Hunter x Hunter",cat:"مغامرات",img:"https://cdn.myanimelist.net/images/anime/1337/99013.jpg"},
{name:"Re:Zero",cat:"ايسيكاي",img:"https://cdn.myanimelist.net/images/anime/1522/128039.jpg"},
{name:"Mushoku Tensei",cat:"ايسيكاي",img:"https://cdn.myanimelist.net/images/anime/1028/117777.jpg"},
{name:"Cowboy Bebop",cat:"اكشن",img:"https://cdn.myanimelist.net/images/anime/4/19644.jpg"},
{name:"Boruto",cat:"شونين",img:"https://cdn.myanimelist.net/images/anime/1096/101356.jpg"},
{name:"JoJo",cat:"اكشن",img:"https://cdn.myanimelist.net/images/anime/3/40465.jpg"},
{name:"Mob Psycho 100",cat:"اكشن",img:"https://cdn.myanimelist.net/images/anime/5/82897.jpg"},
{name:"No Game No Life",cat:"ايسيكاي",img:"https://cdn.myanimelist.net/images/anime/5/65187.jpg"},
];
const cats=["الكل","اكشن","ايسيكاي","مغامرات","شونين"];
let cur="الكل";
function init(){document.getElementById('cats').innerHTML=cats.map(c=>`<button class="${c===cur?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('');}
function setCat(c){cur=c;init();filt();}
function filt(){
let q=document.getElementById('s').value.toLowerCase();
let list=animes.filter(a=>(cur==="الكل"||a.cat===cur)&&a.name.toLowerCase().includes(q));
document.getElementById('grid').innerHTML=list.map(a=>`
<div class="card">
<img src="https://wsrv.nl/?url=${encodeURIComponent(a.img)}&w=300&h=400&fit=cover" loading="lazy" onerror="this.src='${a.img}'">
<div class="t"><h3>${a.name}</h3><div class="meta"><span class="c">${a.cat}</span><span>HD</span></div></div>
</div>`).join('');
}
init();filt();
</script>
</body>
</html>
