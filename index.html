<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIMORA - افضل موقع انمي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#08080f;color:#fff;overflow-x:hidden}
header{position:sticky;top:0;z-index:100;background:rgba(8,8,15,0.9);backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;padding:14px 4%;border-bottom:1px solid #1f1f2e}
.logo{font-size:28px;font-weight:900;letter-spacing:1px}.logo b{color:#a78bfa}
.nav{display:flex;gap:20px;font-size:14px;opacity:0.8}
.search-wrap{width:92%;margin:20px auto;background:#15151f;border:1px solid #2a2a3a;border-radius:30px;display:flex;align-items:center;padding:10px 20px}
.search-wrap input{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:15px}
.hero{width:92%;margin:20px auto;height:420px;border-radius:20px;background:linear-gradient(90deg,rgba(0,0,0,0.8) 0%,rgba(0,0,0,0.1) 100%),url('https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=1200');background-size:cover;display:flex;align-items:end;padding:30px;position:relative}
.hero-content h1{font-size:48px;line-height:1}.tag{background:#a78bfa;color:#000;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.btns{margin-top:15px;display:flex;gap:10px}.btn{padding:12px 24px;border-radius:12px;border:none;font-weight:700;cursor:pointer}.btn-p{background:#a78bfa;color:#000}.btn-s{background:rgba(255,255,255,0.15);color:#fff;backdrop-filter:blur(5px)}
.cats{width:92%;margin:20px auto;display:flex;gap:10px;overflow-x:auto}.cat{white-space:nowrap;padding:8px 18px;border-radius:20px;background:#15151f;border:1px solid #2a2a3a;cursor:pointer;font-size:13px}.cat.active{background:#a78bfa;color:#000;border-color:#a78bfa}
.section-title{width:92%;margin:25px auto 10px;font-size:20px;font-weight:800;display:flex;justify-content:space-between}
.grid{width:92%;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:#12121a;border-radius:14px;overflow:hidden;cursor:pointer;transition:0.3s;border:1px solid #1e1e2e}.card:hover{transform:translateY(-5px);border-color:#a78bfa}
.card img{width:100%;height:210px;object-fit:cover}.card-info{padding:10px}.card-info h4{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-info span{font-size:11px;opacity:0.5}
#player{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:999;display:none;align-items:center;justify-content:center;padding:20px}#player.active{display:flex}.player-box{width:100%;max-width:900px;background:#0f0f17;border-radius:16px;overflow:hidden}.player-box iframe{width:100%;height:480px;border:none}
@media(max-width:600px){.hero{height:300px}.hero-content h1{font-size:32px}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="logo">ANIMORA<b>.IO</b></div><div class="nav"><span>الرئيسية</span><span>الافلام</span><span>المفضلة</span></div></header>
<div class="search-wrap"><input id="search" placeholder="ابحث عن 1000+ انمي مترجم..." oninput="filterAnime()"><span>🔍</span></div>
<div class="hero"><div class="hero-content"><span class="tag">الأكثر مشاهدة 🔥</span><h1>JUJUTSU<br>KAISEN S2</h1><p style="opacity:0.7;margin-top:8px">غوجو ساتورو يعود بأقوى قتال في تاريخ الانمي</p><div class="btns"><button class="btn btn-p" onclick="playAnime('Jujutsu Kaisen')">▶ شاهد الان</button><button class="btn btn-s">التفاصيل</button></div></div></div>
<div class="cats"><div class="cat active">الكل</div><div class="cat">اكشن</div><div class="cat">رومانسي</div><div class="cat">ايسيكاي</div><div class="cat">شونين</div><div class="cat">كوميدي</div></div>
<div class="section-title"><span>يعرض الان</span><span style="font-size:12px;opacity:0.5;color:#a78bfa">عرض الكل ←</span></div>
<div class="grid" id="grid"></div>
<div id="player" onclick="closePlayer()"><div class="player-box" onclick="event.stopPropagation()"><iframe id="videoFrame" src="" allowfullscreen></iframe><div style="padding:15px;display:flex;justify-content:space-between"><h3 id="playerTitle"></h3><button onclick="closePlayer()" style="background:#a78bfa;border:none;padding:6px 14px;border-radius:8px;cursor:pointer">اغلاق ✕</button></div></div></div>
<script>
const animes=[
{name:"Attack on Titan Final",cat:"اكشن",img:"https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=400"},
{name:"Demon Slayer",cat:"اكشن",img:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400"},
{name:"One Piece",cat:"شونين",img:"https://images.unsplash.com/photo-1612036782180-6f0b6cd846fe?w=400"},
{name:"Naruto Shippuden",cat:"شونين",img:"https://images.unsplash.com/photo-1601850494422-3cf14624b0?w=400"},
{name:"Spy x Family",cat:"كوميدي",img:"https://images.unsplash.com/photo-1560167016-022b78a0258e?w=400"},
{name:"Solo Leveling",cat:"اكشن",img:"https://images.unsplash.com/photo-1531259683007-016a7bbe742f?w=400"},
{name:"Frieren",cat:"فانتازيا",img:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400"},
{name:"Chainsaw Man",cat:"اكشن",img:"https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=400"},
];
function render(list){const g=document.getElementById('grid');g.innerHTML='';list.forEach(a=>{g.innerHTML+=`<div class="card" onclick="playAnime('${a.name}')"><img src="${a.img}"><div class="card-info"><h4>${a.name}</h4><span>${a.cat} • HD</span></div></div>`})}
function filterAnime(){const q=document.getElementById('search').value.toLowerCase();render(animes.filter(a=>a.name.toLowerCase().includes(q)))}
function playAnime(title){document.getElementById('player').classList.add('active');document.getElementById('playerTitle').innerText=title;document.getElementById('videoFrame').src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1"}
function closePlayer(){document.getElementById('player').classList.remove('active');document.getElementById('videoFrame').src=""}
render(animes);
</script>
</body>
</html>
