<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تصاور NOVA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff;padding:20px}
h1{text-align:center;margin:20px;font-size:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#111;border-radius:12px;overflow:hidden;border:1px solid #333}
.card img{width:100%;height:220px;object-fit:cover;display:block}
.card p{text-align:center;padding:8px;font-size:13px;font-weight:700}
</style>
</head>
<body>
<h1>🎨 تصاور NOVA ANIME</h1>
<div class="grid">

<div class="card">
<img src="./images/onepiece.jpg" alt="One Piece">
<p>One Piece</p>
</div>

<div class="card">
<img src="./images/naruto.jpg" alt="Naruto">
<p>Naruto</p>
</div>

<div class="card">
<img src="./images/berserk.jpg" alt="Berserk">
<p>Berserk</p>
</div>

<div class="card">
<img src="./images/attack.jpg" alt="Attack">
<p>Attack on Titan</p>
</div>

<div class="card">
<img src="./images/demon.jpg" alt="Demon">
<p>Demon Slayer</p>
</div>

<div class="card">
<img src="./images/jujutsu.jpg" alt="Jujutsu">
<p>Jujutsu Kaisen</p>
</div>

</div>
</body>
</html>
